# gitleaks (CI "secrets" job): default rules, plus an allowlist for places that hold fake secrets
# on purpose. tests/unit/test_redact.py feeds sample tokens to the redactor; the e2e scripts and
# docs use placeholder keys. Everything else is scanned with the default rules.
title = "FaultSage"

[extend]
useDefault = true

[allowlist]
description = "Fake secrets in tests, end-to-end scripts and documentation examples"
paths = [
  '''(^|/)tests/''',
  '''(^|/)web/e2e/''',
  '''(^|/)docs/''',
  '''(^|/)\.env\.example$''',
]

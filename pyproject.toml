[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faultsage"
version = "0.1.0"
description = "Finds the line that broke your Python project, shows what else it broke, and checks your fix."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [{ name = "Renaissance Nath" }]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "networkx>=3.2",
  "watchdog>=4",
  "tomli-w>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
cloud = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23",
]
dev = [
  "faultsage[cloud]",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "coverage>=7",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
faultsage = "faultsage.cli.main:app"
faultsage-cloud = "faultsage.cloud.cli:app"

[project.entry-points.pytest11]
faultsage = "faultsage.collectors.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faultsage = ["py.typed", "cloud/breached_passwords.txt", "analysis/weights.json", "storage/migrations/*.sql", "cloud/storage/migrations/*.sql", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N", "C4"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "E501"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
# These modules exist to run processes. Every call uses an argument list, shell=False and a timeout
# (SR-7, SR-10); reviewed by hand and by Semgrep rule no-shell-true.
"src/faultsage/bench/**" = ["S603", "S607", "S311"]
"src/faultsage/verify/runner.py" = ["S603", "S607"]
"src/faultsage/cloud/storage/db.py" = ["S603"]
"tools/**" = ["S603", "S607"]
"tests/**" = ["S", "PTH", "N802"]
"src/faultsage/cli/*.py" = ["B008"]
"src/faultsage/cloud/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["faultsage.analysis.*", "faultsage.fixes.*", "faultsage.storage.*", "faultsage.api.*", "faultsage.models.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs Docker and benchmark data"]
addopts = "-p no:faultsage"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
  "ignore:cannot collect test class 'TestOutcome':pytest.PytestCollectionWarning",
]

[tool.bandit]
exclude_dirs = ["tests"]
# B404/B603/B607: every subprocess call uses an argument list, shell=False and a timeout; Semgrep
# rule no-shell-true and tests/security enforce it. B311: random only for benchmark baselines and
# bootstrap intervals, never for security. B105: SECRET_KEY_NAMES is a regex of key names.
skips = ["B404", "B603", "B607", "B311", "B105"]

# Render Blueprint (free web service). Database: create a free PostgreSQL on Neon (neon.tech)
# and paste its connection string into DATABASE_URL when Render asks for it.
services:
  - type: web
    name: faultsage
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: FAULTSAGE_ENV
        value: production
      - key: FAULTSAGE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FAULTSAGE_BASE_URL
        sync: false
      - key: FAULTSAGE_SUPPORT_EMAIL
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Render's proxy adds one X-Forwarded-For entry. Set 2 if you put Cloudflare in front.
      - key: FAULTSAGE_PROXY_HOPS
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BILLING_PROVIDER
        value: none

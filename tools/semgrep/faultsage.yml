rules:
  - id: no-shell-true
    languages: [python]
    severity: ERROR
    message: "SR-7: subprocess with shell=True is banned. Pass an argument list."
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: no-os-system
    languages: [python]
    severity: ERROR
    message: "SR-7: os.system is banned."
    pattern: os.system(...)

  - id: no-eval-exec
    languages: [python]
    severity: ERROR
    message: "SR-7: eval/exec on dynamic input is banned."
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: no-pickle-load
    languages: [python]
    severity: ERROR
    message: "SR-7: pickle loads of untrusted data are banned."
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: no-bind-all-interfaces
    languages: [python]
    severity: ERROR
    message: "SR-1: the server must bind to 127.0.0.1 only."
    pattern: '"0.0.0.0"'

  - id: project-write-outside-apply-gate
    languages: [python]
    severity: WARNING
    message: "SR-11: file writes belong in fixes/apply_gate.py or .faultsage/ storage helpers. Confirm the target is not a project file."
    paths:
      exclude:
        - "src/faultsage/fixes/apply_gate.py"
        - "src/faultsage/storage/"
        - "src/faultsage/collectors/spool.py"
        # Reviewed: these write only inside .faultsage/ or ~/.faultsage (config, lock, control,
        # session, self-monitoring, cloud credentials), the launcher's temp file, a user-chosen
        # export path, or .gitignore after the user said yes (FR-4). Same list as
        # tests/security/test_static_rules.py.
        - "src/faultsage/config/loader.py"
        - "src/faultsage/daemon/runner.py"
        - "src/faultsage/api/routes/local.py"
        - "src/faultsage/cli/main.py"
        - "src/faultsage/cloud_sync.py"
        - "src/faultsage/collectors/launcher.py"
        - "src/faultsage/bench/runner.py"
        - "tests/"
        - "tools/"
    pattern-either:
      - pattern: $P.write_text(...)
      - pattern: $P.write_bytes(...)
      - pattern: open($F, "w", ...)
      - pattern: open($F, "wb", ...)
      - pattern: os.replace(...)

  - id: no-dangerous-inner-html
    languages: [typescript]
    severity: ERROR
    message: "SR-17: render untrusted text as text only."
    pattern: <$EL dangerouslySetInnerHTML={...} />

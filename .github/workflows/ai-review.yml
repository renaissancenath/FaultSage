# Optional AI review of every pull request, using the review prompt in docs/PROMPTS.md
# (tools/ai_review.py). Works with any OpenAI-compatible chat API. Off unless the repository has the
# AI_REVIEW_API_KEY secret and the AI_REVIEW_BASE_URL and AI_REVIEW_MODEL variables; without them
# the job passes and says so. It only comments: it never pushes, approves or merges.
name: ai-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.AI_REVIEW_API_KEY != '' && vars.AI_REVIEW_BASE_URL != '' && vars.AI_REVIEW_MODEL != '' }}
    steps:
      - name: Skip when not configured
        if: env.CONFIGURED != 'true'
        run: echo "AI review is not configured (docs/GITHUB.md). Skipped."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.CONFIGURED == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        if: env.CONFIGURED == 'true'
        with:
          python-version: "3.12"
      - name: Review
        if: env.CONFIGURED == 'true'
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install -q httpx==0.28.1
          python tools/ai_review.py review.md
      - name: Post the review as a comment
        if: env.CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file review.md

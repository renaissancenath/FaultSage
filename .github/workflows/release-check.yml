# The Friday release check (RELEASE_AND_OPERATIONS.md section 3). Runs every Friday and on demand.
# It does NOT tag or deploy: it writes a checklist to the job summary for the engineer.
name: friday-release-check
on:
  schedule:
    - cron: "17 9 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: All PR checks on main
        run: |
          ruff check . && mypy src && pytest -q -m "not slow" && bandit -q -r src -c pyproject.toml
          pip-audit --skip-editable && python tools/slop_check.py && python tools/slop_check.py --contrast
      - name: Breakouts (end-to-end on a real run)
        run: bash tools/breakout.sh
      - name: Pending destructive migrations
        run: python tools/release_report.py migrations >> "$GITHUB_STEP_SUMMARY"
      - name: Open bug reports (GitHub issues and the bug inbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Open bugs" >> "$GITHUB_STEP_SUMMARY"
          gh issue list --label bug --state open --limit 50 \
            --json number,title,labels,createdAt \
            --template '{{range .}}- #{{.number}} {{.title}} ({{timeago .createdAt}}){{"\n"}}{{end}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Launch checklist
        run: python tools/release_report.py checklist >> "$GITHUB_STEP_SUMMARY"

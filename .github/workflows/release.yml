# Release: on a version tag (v0.1.0), run the checks, build the dashboard into the wheel, and attach
# wheel and sdist to a GitHub Release. The engineer creates the tag after the Friday release check.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]" build
      - run: ruff check . && mypy src && pytest -q -m "not slow"
      - run: cd web && npm ci && npm run build
      - run: python -m build
      - name: Wheel contains the dashboard
        run: python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'faultsage/static/app/index.html' in n"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

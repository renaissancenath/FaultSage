# Production-only bugs (RELEASE_AND_OPERATIONS.md section 5): when an issue gets the "prod-bug"
# label, run the free FaultSage triage on the JSON export in the issue body and comment the note.
# The issue body is treated as data: it is parsed as JSON, never executed.
name: triage
on:
  issues:
    types: [labeled, opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'prod-bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Extract the export from the issue body
        env:
          BODY: ${{ github.event.issue.body }}
        run: python tools/extract_json_block.py > report.json || echo '{}' > report.json
      - run: faultsage triage report.json > triage.md
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("triage.md", "utf8").slice(0, 60000);
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: body + "\n\n_Next: give this note to your coding agent with the triage prompt in docs/PROMPTS.md. It opens a fix PR; a human reviews and merges._" });

# Bug reports by email -> GitHub issues, hourly (RELEASE_AND_OPERATIONS.md section 4).
# Needs repository secrets BUG_IMAP_HOST, BUG_IMAP_USER, BUG_IMAP_PASSWORD (any IMAP mailbox,
# for example a mailbox app password). Personal data (sender address, signature) is stripped.
name: bug-inbox
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    env:
      BUG_IMAP_HOST: ${{ secrets.BUG_IMAP_HOST }}
      BUG_IMAP_USER: ${{ secrets.BUG_IMAP_USER }}
      BUG_IMAP_PASSWORD: ${{ secrets.BUG_IMAP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      CONFIGURED: ${{ secrets.BUG_IMAP_HOST != '' }}
    steps:
      - name: Skip when no bug mailbox is configured
        if: env.CONFIGURED != 'true'
        run: echo "No BUG_IMAP_* secrets (docs/GITHUB.md). Skipped."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        if: env.CONFIGURED == 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
        if: env.CONFIGURED == 'true'
      - run: python tools/email_to_issue.py
        if: env.CONFIGURED == 'true'

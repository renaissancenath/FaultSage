# FaultSage CI: runs on every pull request and on main (RELEASE_AND_OPERATIONS.md section 2).
# Free on public repositories. The same checks run offline with tools/ci_local.sh or .ps1.
# Every action is pinned to a full commit SHA (SR-23); the tag is in the comment.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python tools/slop_check.py
      - run: python tools/slop_check.py --contrast

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q -m "not slow" --cov=faultsage --cov-report=term-missing:skip-covered
      - run: bandit -q -r src -c pyproject.toml
      - run: pip-audit --skip-editable
      - name: Semgrep (own venv, its pins conflict with FastAPI's)
        run: |
          python -m venv /tmp/sg && /tmp/sg/bin/pip install -q semgrep
          /tmp/sg/bin/semgrep scan --config tools/semgrep --metrics=off --error
      - name: Generated API types are current
        run: python tools/gen_api_types.py --check

  postgres:
    # The cloud runs on PostgreSQL in production (D-016): run its tests against a real server.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: faultsage_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      FAULTSAGE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/faultsage_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: PostgreSQL client tools for the backup and restore tests
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client && pg_restore --version
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/cloud

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Runtime commands make no outbound connections (SR-6)
        run: sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" pytest -q tests/security -k network

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  screens:
    # Starts a real local daemon and cloud server, then screenshots every screen and runs axe.
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: cd web && npm ci && npm run build && npx playwright@1.49.1 install --with-deps chromium && npm i --no-save playwright@1.49.1
      - run: bash tools/e2e_screens.sh
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: screens
          path: |
            web/test-results/screens
            web/test-results/journey

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t faultsage:ci .
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name fs -e FAULTSAGE_SECRET_KEY=ci-only-secret -e FAULTSAGE_ENV=staging \
            -e DATABASE_URL=sqlite:////tmp/ci.db -p 8000:8000 faultsage:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs fs; exit 1

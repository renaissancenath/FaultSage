# Self-hosting FaultSage Cloud on any VPS: app + PostgreSQL + Caddy (automatic HTTPS).
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: faultsage
      POSTGRES_USER: faultsage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultsage"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://faultsage:${POSTGRES_PASSWORD}@db:5432/faultsage
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./backups:/app/backups

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FAULTSAGE_DOMAIN: ${FAULTSAGE_DOMAIN:?set FAULTSAGE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
